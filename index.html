<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MDQ Blog Program — featured stories</title>
<meta name="color-scheme" content="dark">
<style>
  :root {
    color-scheme: dark;
    --color-fg: #fff;
    --color-muted: #efe4ff;
    --grad-a: #41257e;
    --grad-b: #9763ac;
    --blush: #f5c5b9;
    --mauve: #ca8cb9;
    --navy: #34246f;
    --lens-edge: rgba(206, 199, 255, .85);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; padding: 0; background: transparent; }
  body {
    color: var(--color-fg);
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  .showcase { container-type: size; height: 100%; width: 100%; }
  .banner {
    position: relative;
    display: grid;
    grid-template-columns: 54% 46%;
    height: 100%;
    isolation: isolate;
    overflow: clip;
    background:
      radial-gradient(ellipse at 100% 0, var(--blush), var(--mauve) 27%, transparent 69%),
      radial-gradient(ellipse at 0 100%, var(--navy), transparent 72%),
      linear-gradient(115deg, var(--grad-a), var(--grad-b));
  }
  .copy {
    align-self: start;
    min-width: 0;
    padding: clamp(48px, 18cqb, 98px) 0 0 clamp(28px, 6cqi, 76px);
    z-index: 30;
    pointer-events: none;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: clamp(19px, 2.2cqi, 27px);
    font-weight: 600;
    margin-block-end: clamp(34px, 12cqb, 64px);
  }
  .ms-logo { width: clamp(28px, 3cqi, 38px); height: auto; display: block; }
  h2 {
    font-size: clamp(34px, 5.15cqi, 66px);
    font-weight: 600;
    letter-spacing: -1.8px;
    line-height: 1.12;
    margin: 0;
    text-wrap: balance;
  }
  .stage { position: relative; min-width: 0; min-height: 0; }
  .orbit { position: absolute; inset: 0; pointer-events: none; }
  /* Rendered from the supplied Blender lens with its original material and tilt. */
  .lens {
    position: absolute;
    top: 0; left: 0;
    background: url("assets/glass-lens.webp") center / contain no-repeat;
    pointer-events: none;
    filter: saturate(1.25) brightness(1.14);
    will-change: transform, opacity;
  }
  .lens::after { content: ""; position: absolute; inset: 0; background: url("assets/glass-lens-light.webp") center / contain no-repeat; opacity: var(--glint, 0); }
  .story {
    position: absolute;
    left: 3%;
    top: 24%;
    width: 88%;
    min-height: 210px;
    padding: clamp(23px, 2.6cqi, 34px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 24px;
    color: #fff;
    text-decoration: none;
    border: 0;
    border-radius: 20px;
    background: transparent;
    transform-origin: center;
    will-change: transform;
    z-index: 50;
  }
  .glass-scene { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; filter: saturate(1.25) brightness(1.14); }
  .stage.has-glass .orbit { visibility: hidden; }
  .story-copy { position: relative; display: flex; flex-direction: column; gap: inherit; opacity: var(--text-opacity, 0); text-shadow: 0 1px 10px rgba(25, 17, 79, .4); }
  .story[aria-hidden="true"] { pointer-events: none; }
  .story:hover .read { text-decoration: underline; text-underline-offset: 4px; }
  .story.glass-fallback { background: rgba(113, 117, 220, .38); border: 2px solid rgba(145, 232, 255, .8); box-shadow: inset 2px 2px 4px #dbbdff, inset -3px -3px 4px #36499d; }
  .story:focus-visible { outline: 3px solid #fff; outline-offset: 5px; }
  .story h3 { margin: 0; font-size: clamp(23px, 2.65cqi, 34px); line-height: 1.2; font-weight: 600; letter-spacing: -.5px; text-wrap: balance; }
  .story .read { display: block; font-size: 13px; font-weight: 600; color: #efe3ff; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  @container (max-width: 650px) {
    .banner { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
    .copy { align-self: start; padding: 28px 26px 0; }
    .brand { margin-block-end: 27px; font-size: 20px; }
    .ms-logo { width: 28px; }
    h2 { font-size: clamp(29px, 7.8cqi, 44px); letter-spacing: -1px; }
    .story { left: 7%; top: 20%; width: 86%; min-height: 170px; padding: 24px; gap: 19px; }
    .story h3 { font-size: clamp(21px, 6cqi, 28px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .lens, .story { will-change: auto; }
  }
</style>
</head>
<body>
<div class="showcase" id="showcase">
  <section class="banner" aria-label="MDQ featured blog stories">
    <div class="copy">
      <div class="brand"><svg class="ms-logo" viewBox="0 0 23 23" aria-hidden="true" focusable="false"><rect x="1" y="1" width="10" height="10" fill="#f25022"/><rect x="12" y="1" width="10" height="10" fill="#7fba00"/><rect x="1" y="12" width="10" height="10" fill="#00a4ef"/><rect x="12" y="12" width="10" height="10" fill="#ffb900"/></svg><span>Microsoft</span></div>
      <h2 data-ui="heading">MDQ Blog Program</h2>
    </div>
    <div class="stage" data-ui="stage">
      <div class="orbit" data-ui="orbit" aria-hidden="true"></div>
      <canvas class="glass-scene" aria-hidden="true"></canvas>
      <a class="story" data-ui="story" href="#" target="_blank" rel="noopener noreferrer" aria-hidden="true" tabindex="-1" style="opacity:0">
        <div class="story-copy"><h3 data-ui="story-title"></h3>
        <span class="read">Read the story <span aria-hidden="true">↗</span><span class="sr"> (opens in a new tab)</span></span></div>
      </a>
    </div>
  </section>
</div>
<script src="glass-morph.js"></script>
<script src="orbit-motion.js"></script>
<script>
(function () {
  "use strict";
  var DEFAULT_STORIES = [
    {
      "title": "Phage therapy with inspectable agents",
      "url": "https://techcommunity.microsoft.com/blog/microsoft-discovery-blog/developing-bioinformatics-workflows-for-phage-therapy-with-inspectable-agents/4560876"
    },
    {
      "title": "Reading the hidden world of environmental viromes",
      "url": "https://techcommunity.microsoft.com/blog/microsoft-discovery-blog/decoding-environmental-viromes-amplifying-human-expertise-with-microsoft-discove/4555806"
    },
    {
      "title": "Exploring chip design with AI",
      "url": "https://techcommunity.microsoft.com/blog/microsoft-discovery-blog/from-ad-astra-to-semper-disco-learning-chip-design-with-microsoft-discovery/4554904"
    },
    {
      "title": "Scientific AI meets RF engineering",
      "url": "https://techcommunity.microsoft.com/blog/microsoft-discovery-blog/execution-optimization-and-exploration-evaluating-scientific-ai-through-rf-engin/4554513"
    },
    {
      "title": "New directions for redox flow batteries",
      "url": "https://techcommunity.microsoft.com/blog/microsoft-discovery-blog/reinventing-organic-redox-flow-batteries-with-microsoft-discovery/4552343"
    },
    {
      "title": "Adaptive scientific discovery",
      "url": "https://techcommunity.microsoft.com/blog/microsoft-discovery-blog/adaptive-by-design-how-microsoft-discovery-explores-science/4552705"
    }
  ];
  var model = window.MDQOrbit, LENSES = model.COUNT;
  var GAP_MS = 1600, OUT_MS = 2400, READ_MS = 14000, IN_MS = 2600;
  var qs = new URLSearchParams(window.location.search);
  var root = document.getElementById("showcase");
  var $ = function (selector) { return root.querySelector(selector); };
  var stage = $('[data-ui="stage"]'), orbit = $('[data-ui="orbit"]');
  var card = $('[data-ui="story"]'), title = $('[data-ui="story-title"]');
  var stories = DEFAULT_STORIES.slice(), storyIndex = 0;
  var phase = 3.00196631343, state = "idle", elapsed = 0, lastTs = 0, raf = 0;
  var visible = true, reading = false, focused = false, selected = -1;
  var lenses = [], W = stage.clientWidth, H = stage.clientHeight;
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  // Explicit embed opt-in for hosts whose desktop reports reduced motion.
  // The unconfigured page continues to respect each visitor's OS preference.
  var forceMotion = qs.get("motion") === "on";
  function motionReduced() { return reduceMotion.matches && !forceMotion; }
  var cardVisible = false;
  var surface = stage.querySelector("canvas"), glass = window.createGlassScene(surface);
  surface.addEventListener("glassready", function () { layout(); });
  function geometry() { return model.geometry(W,H,root.clientWidth<=650); }

  function validStories(list) {
    if (!Array.isArray(list) || !list.length || list.length > 20) return null;
    var out = [];
    for (var i = 0; i < list.length; i++) {
      var s = list[i];
      if (!s || typeof s.title !== "string" || !s.title.trim() || s.title.length > 140 || typeof s.url !== "string") return null;
      try {
        var url = new URL(s.url);
        if (url.protocol !== "https:" || url.username || url.password) return null;
        out.push({ title: s.title.trim(), url: url.href });
      } catch (e) { return null; }
    }
    return out;
  }
  function setStory() {
    var story = stories[storyIndex];
    title.textContent = story.title;
    card.href = story.url;
  }
  function smooth(value) {
    value = Math.max(0, Math.min(1, value));
    return value * value * (3 - 2 * value);
  }
  function amountOut() {
    if (motionReduced()) return 1;
    if (state === "out") return smooth(elapsed / OUT_MS);
    if (state === "hold") return 1;
    if (state === "in") return 1 - smooth(elapsed / IN_MS);
    return 0;
  }
  function layout() {
    var g=geometry(),out=amountOut();
    var cardX=card.offsetLeft+card.offsetWidth/2,cardY=card.offsetTop+card.offsetHeight/2;
    var positions=lenses.map(function(lens,i){return model.slot(phase,i,g);});
    if(motionReduced()&&selected<0)selected=0;
    // Let glass extend across the stage boundary; only the banner crops it.
    var pad=Math.ceil(g.diameter*.65);
    surface.style.left=surface.style.top=-pad+"px";
    surface.style.width=(W+pad*2)+"px";surface.style.height=(H+pad*2)+"px";
    var ready=glass&&glass.begin(W+pad*2,H+pad*2);
    stage.classList.toggle("has-glass",!!ready);
    // Equal size and one phase: the selected slot is the ONLY missing disc.
    var spriteSize=g.diameter/.886;
    positions.forEach(function(pos,i){
      var lens=lenses[i];
      lens.style.width=lens.style.height=spriteSize+"px";
      lens.style.transform="translate("+(pos.x-spriteSize/2)+"px,"+(pos.y-spriteSize/2)+"px)";
      lens.style.opacity=i===selected&&out>0?"0":"1";
      lens.style.setProperty("--glint",String(.2+pos.depth*pos.depth*.65));
    });
    var origin=selected>=0?positions[selected]:{x:cardX,y:cardY,depth:.6};
    var travel=1-out,discW=g.diameter*1.05,discH=discW*.7579934;
    var x=origin.x+(cardX-origin.x)*out,y=origin.y+(cardY-origin.y)*out;
    var finalW=card.offsetWidth*1.1,finalH=card.offsetHeight*1.1;
    var width=discW+(finalW-discW)*out,height=discH+(finalH-discH)*out;
    var angle=67.04*travel*Math.PI/180;
    // Stable exact depth ordering, without rounded z-index ties.
    var surfaces=positions.map(function(pos,i){
      var active=i===selected&&out>0;
      return {x:active?x:pos.x,y:active?y:pos.y,w:active?width:discW,h:active?height:discH,
        angle:active?angle:67.04*Math.PI/180,morph:active?out:0,
        depth:pos.depth,glint:.2+pos.depth*pos.depth*.65,active:active};
    }).sort(function(a,b){return a.depth-b.depth;});
    if(ready){
      var lift=smooth(out/.24),front=null;
      surfaces.forEach(function(item){
        glass.draw(item.x+pad,item.y+pad,item.w,item.h,item.angle,item.morph,item.glint,lift,item.active?1:0);
        if(item.active)front=item;
      });
      // Blend occlusion order instead of jumping a rim across a neighboring rim.
      if(front)glass.draw(front.x+pad,front.y+pad,front.w,front.h,front.angle,front.morph,front.glint,lift,2);
    }
    var startX=discW/finalW,startY=discH/finalH;
    card.style.transform="translate("+(x-cardX)+"px,"+(y-cardY)+"px) rotate("+(67.04*travel)+"deg) scale("+
      (startX+(1-startX)*out)+","+(startY+(1-startY)*out)+")";
    card.style.opacity=out>0?"1":"0";
    card.style.borderRadius=(20+200*travel)+"px";
    card.style.setProperty("--text-opacity",String(smooth((out-.65)/.35)));
    card.classList.toggle("glass-fallback",!ready);
    var available=motionReduced()||state==="hold";
    if(available!==cardVisible){cardVisible=available;card.setAttribute("aria-hidden",String(!available));card.tabIndex=available?0:-1;}
  }
  function buildLenses(){
    for(var i=0;i<LENSES;i++){var lens=document.createElement("div");lens.className="lens";orbit.appendChild(lens);lenses.push(lens);}
  }
  function advance(dt){
    phase=model.future(phase,dt)%model.TAU;
    if(state==="idle"){
      elapsed+=dt;
      if(elapsed>=GAP_MS){
        var candidate=model.select(phase,geometry(),OUT_MS+READ_MS+IN_MS);
        if(candidate>=0){selected=candidate;state="out";elapsed=0;}
      }
    }else if(state==="out"){
      elapsed+=dt;if(elapsed>=OUT_MS){state="hold";elapsed=0;}
    }else if(state==="hold"){
      if(!(reading||focused))elapsed+=dt;
      // After a long hover, wait for THIS gap's next visible return window.
      if(elapsed>=READ_MS&&!(reading||focused)&&model.canReturn(phase,selected,geometry(),IN_MS)){state="in";elapsed=0;}
    }else{
      elapsed+=dt;
      if(elapsed>=IN_MS){state="idle";elapsed=0;selected=-1;storyIndex=(storyIndex+1)%stories.length;setStory();}
    }
  }
  function frame(ts){
    raf=0;
    if(document.hidden||!visible){lastTs=0;return;}
    var dt=lastTs?Math.min(ts-lastTs,80):0;lastTs=ts;
    if(!motionReduced())advance(dt);
    layout();
    if(!motionReduced())raf=requestAnimationFrame(frame);
  }
  function syncMotion() {
    cancelAnimationFrame(raf); raf = 0; lastTs = 0;
    if (!document.hidden && visible) raf = requestAnimationFrame(frame);
  }
  card.addEventListener("pointerenter", function () { reading = true; });
  card.addEventListener("pointerleave", function () { reading = false; });
  card.addEventListener("focus", function () { focused = true; });
  card.addEventListener("blur", function () { focused = false; });
  document.addEventListener("visibilitychange", syncMotion);
  reduceMotion.addEventListener("change", function () { state="idle";elapsed=0;selected=-1;syncMotion(); });
  new ResizeObserver(function () {
    W = stage.clientWidth; H = stage.clientHeight;
    if(state==="in"&&!model.canReturn(phase,selected,geometry(),Math.max(0,IN_MS-elapsed))){
      // A viewport change can move the landing out of frame. Reverse continuously,
      // keep the same selected slot, and wait for its next visible return window.
      state="out";elapsed=OUT_MS*(1-Math.min(1,elapsed/IN_MS));
    }
    layout();
  }).observe(stage);
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(function (entries) { visible = entries[0].isIntersecting; syncMotion(); }).observe(stage);
  }

  buildLenses(); setStory(); layout(); syncMotion();
  try {
    var source = new URL(qs.get("stories") || "stories.json", window.location.href);
    if (source.origin === window.location.origin && /^https?:$/.test(source.protocol)) {
      fetch(source.href, { cache: "no-cache" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (data) {
          var list = validStories(data);
          if (list) { stories = list; storyIndex = 0; setStory(); layout(); }
        }).catch(function () { /* Keep public fallback stories. */ });
    }
  } catch (e) { /* Keep public fallback stories. */ }
})();
</script>
</body>
</html>
